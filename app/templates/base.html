<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECEIPT CAPTURE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            
            <span class="navbar-brand fw-bold border border-light rounded px-3 py-1 me-4">
                RECEIPT CAPTURE
            </span>
            
            {% block top %}
            {% endblock %}

            <div class="navbar-text ms-auto">
                {% if current_user.is_authenticated %}
                    <span class="me-3 text-white small d-none d-sm-inline">{{ current_user.mailaddress }} でログイン中</span>
                    <a class="btn btn-primary btn-sm" href="{{ url_for('logout') }}">ログアウト</a>
                {% endif %}
            </div>
            
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
