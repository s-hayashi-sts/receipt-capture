<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        {% if current_user.is_authenticated %}
        <p>
            <span>{{ current_user.mailaddress }} でログイン中</span>
            <span><a href="{{ url_for('logout') }}">ログアウト</a></span>
        </p>
        {% endif %}
    </div>
    {% block content %}
    {% endblock %}
</body>
</html>
