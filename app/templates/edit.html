{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h5 class="card-title mb-0">登録内容の編集</h5>
                </div>
                
                <div class="card-body p-4">
                    <meta name="csrf-token" content="{{ csrf_token() }}">

                    <form action="/edit" method="POST" id="editFormSubmit">
                        <input type="hidden" name="csrf_token" id="csrf_token_input" value="">

                        {% if error %}
                        <div class="alert alert-danger mt-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                        </div>
                        {% endif %}

                        <div class="mb-4 pb-3 border-bottom">
                            <label for="registerDatetime" class="form-label fw-bold text-secondary">
                                <i class="bi bi-calendar-event me-1"></i> {{ register_datetime.name }}の編集
                            </label>
                            <input type="datetime-local" 
                                    class="form-control form-control-lg font-monospace" 
                                    id="registerDatetime" 
                                    data-raw-value="{{ register_datetime.datetime }}"
                                    onblur="updateDatetime(this)"
                                    required>
                            <div id="datetimeError" class="text-danger small mt-2 d-none">
                                <i class="bi bi-exclamation-circle-fill me-1"></i> 
                                <span id="datetimeErrorText">日時は1年前から現在までの間で入力してください。</span>
                            </div>
                            <div class="form-text">カレンダーアイコンから日時を選択してください。</div>
                        </div>

                        <div id="editForm">
                            {% include "edit_table.html" %}
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-4">
                            <button type="button" class="btn btn-outline-danger px-4" onclick="cancelEditForm()">
                                <i class="bi bi-x-circle me-1"></i> キャンセル
                            </button>
                            
                            <button type="button" class="btn btn-success px-5 btn-lg shadow-sm" onclick="submitEditForm()">
                                <i class="bi bi-check2-circle me-1"></i> 確認画面へ
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/edit.js') }}"></script>
{% endblock %}
